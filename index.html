<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <title>Трекер прочитаних книг</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Трекер прочитаних книг</h1>

        <nav>
            <a href="#add-book">Додати книгу</a>
            <a href="#my-books">Мої книги</a>
            <a href="#statistics">Статистика</a>
        </nav>
    </header>

    <div class="layout">

        <main>
            <section id="add-book">
                <h2>Додати книгу</h2>

                <form id="book-form">
                    <label for="book-title">Назва книги:</label>
                    <input
                            type="text"
                            id="book-title"
                            name="title"
                            required
                    >

                    <label for="book-author">Автор:</label>
                    <input
                            type="text"
                            id="book-author"
                            name="author"
                            required
                            pattern="[^0-9]+"
                    >

                    <label for="book-pages">Кількість сторінок:</label>
                    <input
                            type="number"
                            id="book-pages"
                            name="pages"
                            required
                            min="1"
                    >

                    <label for="book-status">Статус:</label>
                    <select id="book-status" name="status">
                        <option value="reading">Читаю</option>
                        <option value="completed">Прочитано</option>
                    </select>

                    <button type="submit">Додати книгу</button>
                </form>
            </section>

            <section id="my-books">
                <h2>Мої книги</h2>

                <div class="cards" id="books-list">

                    <article class="book-card">
                        <div class="book-cover">Обкладинка</div>
                        <h3>1984</h3>
                        <p>Автор: Джордж Орвелл</p>
                        <p>
                            Статус:
                            <span class="status status-completed">Прочитано</span>
                        </p>
                    </article>

                </div>
            </section>
        </main>

        <aside id="statistics">
            <h2>Статистика читання</h2>
            <p id="books-count">Усього книг: 0</p>
            <p id="completed-count">Прочитано: 3</p>
        </aside>

    </div>

    <footer>
        <p>2026 Навчальний проект з програмування веб застосунків. Виконала: Кошева Марія</p>
    </footer>

</body>
</html>
